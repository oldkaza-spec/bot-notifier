name: Send Alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * 0-4'
    - cron: '30 7 * * 0-4'
    - cron: '30 11 * * 0-4'
    - cron: '15 13 * * 1-5'
    - cron: '35 13 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 20 * * 1-5'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-telegram-bot yfinance pandas requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_2: ${{ secrets.BOT_TOKEN_2 }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
