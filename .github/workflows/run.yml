name: Send Alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python bot.py
        env:
          TOKEN_M7M7: ${{ secrets.TOKEN_M7M7 }}
          TOKEN_PENNY: ${{ secrets.TOKEN_PENNY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
